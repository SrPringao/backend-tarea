"""
API GraphQL de Finanzas Personales (etapa 2).

Autenticación: envía `Authorization: Bearer TOKEN` (el token se obtiene con POST /api/auth/login).
Las fechas son texto `YYYY-MM-DD`, los meses `YYYY-MM` y los montos son pesos con 2 decimales.
"""
schema {
  query: Query
  mutation: Mutation
}

"""
Archivo subido con multipart/form-data (GraphQL multipart request spec).
"""
scalar File

scalar DateTime

type Query {
  """Comprueba que el servidor GraphQL responde."""
  ping: String!

  """
  OP-025. Estado de cuenta de una tarjeta de crédito; month YYYY-MM (por defecto el mes actual). Requiere token.
  """
  creditCardStatement(accountId: Int!, month: String): CreditCardStatement!

  """Datos del usuario autenticado. Requiere token."""
  me: User!

  """
  OP-085. Tokens de API del usuario (sin el valor secreto). Requiere token.
  """
  apiTokens: [ApiToken!]!

  """OP-086. Mapeos de nombres de tarjeta del usuario. Requiere token."""
  cardNameMappings: [CardNameMapping!]!

  """
  OP-048. Sugerencias de gasto según lo que el usuario ha registrado antes (autocompletar). Requiere token.
  """
  expenseSuggestions(prefix: String!, limit: Int = 5): [ExpenseSuggestion!]!

  """
  OP-050. Exporta los gastos de un rango a CSV (compatible con Excel; protegido contra inyección de fórmulas). Requiere token.
  """
  exportExpensesCsv(from: String!, to: String!): CsvExport!

  """OP-076. Proyecciones guardadas del usuario. Requiere token."""
  projections: [Projection!]!

  """OP-083. Dispositivos registrados del usuario. Requiere token."""
  devices: [Device!]!

  """
  OP-080. Gasto por día del mes con acumulado; month YYYY-MM (por defecto el actual). Requiere token.
  """
  dailySpending(month: String): DailySpending!

  """
  OP-081. Compara el gasto por categoría entre dos meses (por defecto el mes anterior contra el actual). Requiere token.
  """
  categoryComparison(monthA: String, monthB: String): CategoryComparison!
}

type Mutation {
  """Comprueba que las mutaciones están disponibles."""
  ping: String!

  """
  OP-024. Define el orden de las cuentas según la posición de cada id en la lista. Requiere token.
  """
  reorderAccounts(ids: [Int!]!): [Account!]!

  """
  OP-023. Sube la imagen de la tarjeta (JPEG o PNG, máximo 2 MB) con multipart/form-data.
  Se guarda en Supabase Storage (bucket privado) o en disco si Supabase no está configurado. Requiere token.
  """
  uploadAccountImage(accountId: Int!, file: File!): Account!

  """
  OP-006. Envía al correo un código de 6 dígitos para restablecer la contraseña (vence en 15 minutos).
  Responde lo mismo exista o no el correo, para no revelar qué cuentas existen. Pública.
  """
  requestPasswordReset(email: String!): OperationResult!

  """
  OP-007. Cambia la contraseña con el código recibido (máximo 5 intentos por código).
  Cierra las sesiones abiertas en otros dispositivos y envía un aviso de "tu contraseña cambió". Pública.
  """
  resetPassword(email: String!, code: String!, newPassword: String!): OperationResult!

  """
  OP-008. Entrega una sesión nueva a cambio de un refresh token (rotación: cada refresh token sirve una vez).
  Si se reutiliza uno ya usado, se cierran todas las sesiones del usuario. Pública.
  """
  refreshToken(refreshToken: String!): Session!

  """
  OP-009. Cierra la sesión: revoca el token de acceso actual y el refresh token indicado,
  o todos los refresh tokens con allDevices: true. Requiere token.
  """
  logout(refreshToken: String, allDevices: Boolean): OperationResult!

  """
  OP-010. Confirma el correo con el token del enlace enviado al registrarse. Pública.
  """
  verifyEmail(token: String!): User!

  """
  OP-010. Reenvía el correo de confirmación de cuenta al usuario autenticado. Requiere token.
  """
  sendVerificationEmail: OperationResult!

  """
  OP-085. Crea un token de API personal (máximo 10 activos). Requiere token.
  """
  createApiToken(name: String!): CreatedApiToken!

  """
  OP-085. Revoca un token de API; deja de funcionar de inmediato. Requiere token.
  """
  revokeApiToken(id: Int!): ApiToken!

  """
  OP-086. Mapea un nombre de tarjeta a una cuenta propia. Requiere token.
  """
  createCardNameMapping(cardName: String!, accountId: Int!): CardNameMapping!

  """
  OP-087. Registra un gasto desde una automatización (webhook).
  Se autentica con la cabecera X-API-Key (no con Bearer). La tarjeta se resuelve por el mapeo
  de nombres o por el nombre exacto de la cuenta; la categoría (opcional) por su nombre.
  """
  webhookExpense(amount: Float!, card: String!, description: String, date: String, category: String): Expense!

  """
  OP-057. Revisa el presupuesto del mes y los límites por categoría; envía un correo con las alertas nuevas.
  month YYYY-MM (por defecto el actual). También se ejecuta solo cada día si ENABLE_SCHEDULER=true. Requiere token.
  """
  checkBudgetAlerts(month: String): [BudgetAlert!]!

  """
  OP-031. Crea las categorías predeterminadas que falten (Comida, Transporte, Hogar...). Devuelve solo las nuevas. Requiere token.
  """
  createDefaultCategories: [Category!]!

  """
  OP-032. Pasa los gastos y gastos fijos de sourceId a targetId y elimina sourceId. Requiere token.
  """
  mergeCategories(sourceId: Int!, targetId: Int!): MergeCategoriesResult!

  """
  OP-033. Define (o quita con null) el límite de gasto mensual; se usa en checkBudgetAlerts. Requiere token.
  """
  setCategoryLimit(categoryId: Int!, monthlyLimit: Float): Category!

  """
  OP-039. Pasa los registros de patrimonio y gastos divididos de sourceId a targetId y elimina sourceId. Requiere token.
  """
  mergeContacts(sourceId: Int!, targetId: Int!): MergeContactsResult!

  """
  OP-049. Importa gastos desde un CSV (máximo 500 filas, 512 KB). Envía el archivo (file, multipart) o el texto (csv).
  Columnas: fecha, monto, descripcion, cuenta, categoria (o en inglés). La cuenta se busca por nombre o por mapeo de tarjeta.
  Todo o nada: si alguna fila tiene error no se importa ninguna. Requiere token.
  """
  importExpensesCsv(file: File, csv: String): ImportResult!

  """
  OP-051. Adjunta el ticket o comprobante (JPEG, PNG o PDF, máximo 2 MB) con multipart/form-data. Requiere token.
  """
  attachReceipt(expenseId: Int!, file: File!): Expense!

  """
  OP-052. Divide un gasto entre contactos. Cada parte crea un registro de patrimonio "te debe" ligado al contacto.
  Las partes no pueden sumar más que el gasto. Requiere token.
  """
  splitExpense(expenseId: Int!, parts: [SplitPartInput!]!): SplitResult!

  """
  OP-065. Registra el gasto real de un gasto fijo (con su categoría y nombre) y marca el mes como pagado.
  La fecha por defecto es el día de pago del gasto fijo en ese mes. Requiere token.
  """
  fixedExpenseToExpense(fixedExpenseId: Int!, month: String!, accountId: Int!, date: String, amount: Float): FixedExpenseToExpenseResult!

  """
  OP-066. Busca gastos fijos sin pagar que vencen en los próximos daysAhead días y envía un recordatorio por correo.
  También se ejecuta solo cada día si ENABLE_SCHEDULER=true. Requiere token.
  """
  sendPaymentReminders(daysAhead: Int = 3): [PaymentReminder!]!

  """
  OP-073. Define el orden de los registros de patrimonio según la posición de cada id. Requiere token.
  """
  reorderNetWorth(ids: [Int!]!): [NetWorthEntry!]!

  """
  OP-074. Actualiza una deuda ligada a una tarjeta de crédito con el saldo de la tarjeta en el mes actual. Requiere token.
  """
  syncNetWorthWithAccount(entryId: Int!): SyncNetWorthResult!

  """
  OP-075. Crea una proyección. Si no se envía startingAmount se usa el patrimonio neto actual (mínimo 0).
  annualRate en porcentaje (0 a 100), months de 1 a 600. Requiere token.
  """
  createProjection(name: String!, startingAmount: Float, monthlyContribution: Float!, annualRate: Float!, months: Int!): Projection!

  """OP-077. Elimina una proyección. Requiere token."""
  deleteProjection(id: Int!): OperationResult!

  """
  OP-082. Registra o actualiza el dispositivo para notificaciones push. Requiere token.
  """
  registerDevice(token: String!, platform: String!): Device!

  """
  OP-084. Envía por correo el resumen de gastos de un día (por defecto ayer) a cada usuario activo con correo verificado.
  También se ejecuta solo cada mañana si ENABLE_SCHEDULER=true. Requiere rol admin.
  """
  sendDailySummary(date: String): DailySummaryResult!
}

"""Resultado simple de una operación."""
type OperationResult {
  ok: Boolean!
  message: String!
}

"""Tarjeta de crédito, débito o efectivo."""
type Account {
  id: Int!
  name: String!

  """credit, debit o cash"""
  type: String!
  color: String

  """Día límite de pago (solo tarjetas de crédito)."""
  paymentDay: Int
  creditLimit: Float

  """Posición definida con reorderAccounts."""
  sortOrder: Int!

  """URL temporal (1 hora) de la imagen de la tarjeta, si se subió una."""
  imageUrl: String
  archivedAt: DateTime
  createdAt: DateTime!
}

"""Estado de cuenta mensual de una tarjeta de crédito."""
type CreditCardStatement {
  account: Account!
  month: String!
  periodStart: String!
  periodEnd: String!

  """Fecha límite de pago (día de pago del mes siguiente)."""
  dueDate: String!

  """Total de gastos con la tarjeta en el periodo."""
  balance: Float!
  expenseCount: Int!

  """
  Aproximado: mayor entre 1.5 % del saldo y 1.25 % del límite, sin pasar del saldo.
  """
  minimumPayment: Float!
  creditLimit: Float
  availableCredit: Float

  """Porcentaje del límite utilizado."""
  utilization: Float
}

"""Usuario autenticado (nunca incluye el hash de la contraseña)."""
type User {
  id: ID!
  email: String!
  displayName: String!

  """user o admin"""
  role: String!
  isActive: Boolean!

  """true si ya confirmó su correo con el enlace que se le envió."""
  emailVerified: Boolean!
  emailVerifiedAt: DateTime
  createdAt: DateTime!
}

"""Sesión: token de acceso (JWT) y refresh token para renovarlo."""
type Session {
  """JWT para la cabecera Authorization: Bearer TOKEN."""
  token: String!
  tokenType: String!

  """Vigencia del token de acceso (p. ej. 8h)."""
  expiresIn: String!

  """Token de un solo uso para obtener una sesión nueva con refreshToken."""
  refreshToken: String!
  user: User!
}

"""
Token de API personal para automatizaciones (Atajos de iOS, scripts). El valor completo solo se muestra al crearlo.
"""
type ApiToken {
  id: Int!
  name: String!
  lastUsedAt: DateTime
  revokedAt: DateTime
  createdAt: DateTime!
}

type CreatedApiToken {
  """Valor del token (empieza con fin_). Guárdalo: no se vuelve a mostrar."""
  token: String!
  apiToken: ApiToken!
}

"""
Relaciona el nombre con el que llega una tarjeta (p. ej. desde Atajos de iOS) con una cuenta.
"""
type CardNameMapping {
  id: Int!
  cardName: String!
  account: Account!
  createdAt: DateTime!
}

"""
Alerta de gasto: el presupuesto del mes o el límite de una categoría llegó al 80 % o al 100 %.
"""
type BudgetAlert {
  """BUDGET (presupuesto del mes) o CATEGORY (límite de una categoría)"""
  type: String!
  label: String!
  categoryId: Int
  month: String!
  limit: Float!
  spent: Float!
  percentUsed: Float!

  """Umbral alcanzado: 80 o 100."""
  threshold: Int!

  """
  true si se notificó por correo en esta llamada (cada alerta se notifica una sola vez).
  """
  notified: Boolean!
}

"""Categoría de gasto."""
type Category {
  id: Int!
  name: String!
  color: String

  """Límite de gasto mensual (null si no tiene)."""
  monthlyLimit: Float

  """Gastado en la categoría durante el mes actual."""
  spentThisMonth: Float!
  createdAt: DateTime!
}

type MergeCategoriesResult {
  """Categoría que conserva los gastos."""
  target: Category!
  movedExpenses: Int!
  movedFixedExpenses: Int!
}

"""Persona que te debe dinero."""
type Contact {
  id: Int!
  name: String!
  archivedAt: DateTime
  createdAt: DateTime!
}

type MergeContactsResult {
  """Contacto que conserva los registros."""
  target: Contact!
  movedNetWorthEntries: Int!
  movedExpenseSplits: Int!
}

"""Gasto variable."""
type Expense {
  id: Int!
  amount: Float!

  """YYYY-MM-DD"""
  date: String!
  description: String
  accountId: Int!
  accountName: String!
  accountType: String!
  categoryId: Int
  categoryName: String
  categoryColor: String

  """URL temporal (1 hora) del ticket o comprobante, si se adjuntó."""
  receiptUrl: String

  """Partes del gasto que pagan otras personas."""
  splits: [ExpenseSplit!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Sugerencia para autocompletar al registrar un gasto."""
type ExpenseSuggestion {
  description: String!
  timesUsed: Int!
  averageAmount: Float!

  """Cuenta usada con más frecuencia con esta descripción."""
  accountId: Int

  """Categoría usada con más frecuencia con esta descripción."""
  categoryId: Int
}

type ImportError {
  """Línea del CSV (la 1 es el encabezado)."""
  line: Int!
  message: String!
}

type ImportResult {
  """
  Gastos importados. Es 0 si hubo algún error: la importación es todo o nada.
  """
  imported: Int!
  totalAmount: Float!
  errors: [ImportError!]!
}

type CsvExport {
  filename: String!
  contentType: String!
  rows: Int!

  """
  Contenido del CSV (UTF-8 con BOM, columnas: fecha, monto, descripcion, cuenta, categoria).
  """
  content: String!
}

"""
Parte de un gasto que paga un contacto; genera un activo de patrimonio (te debe).
"""
type ExpenseSplit {
  id: Int!
  expenseId: Int!
  contactId: Int!
  contactName: String!
  amount: Float!

  """Registro de patrimonio creado para cobrar esta parte."""
  netWorthEntryId: Int
  createdAt: DateTime!
}

type SplitResult {
  expense: Expense!
  splits: [ExpenseSplit!]!

  """Lo que te toca pagar a ti (monto del gasto menos las partes)."""
  yourShare: Float!
}

input SplitPartInput {
  contactId: Int!
  amount: Float!
}

"""Pago mensual de un gasto fijo."""
type FixedExpensePayment {
  id: Int!
  fixedExpenseId: Int!
  month: String!
  amount: Float!

  """Gasto real generado para este pago."""
  expenseId: Int
  paidAt: DateTime!
}

type FixedExpenseToExpenseResult {
  expense: Expense!
  payment: FixedExpensePayment!
}

"""Gasto fijo por vencer y sin pagar."""
type PaymentReminder {
  fixedExpenseId: Int!
  name: String!
  amount: Float!
  dayOfMonth: Int!
  month: String!

  """
  true si se incluyó en el correo de esta llamada (cada pago se recuerda una vez por mes).
  """
  notified: Boolean!
}

"""Activo (saldo, dinero que te deben) o deuda."""
type NetWorthEntry {
  id: Int!
  label: String!

  """asset o debt"""
  kind: String!
  amount: Float!
  dueDate: String
  sortOrder: Int!
  accountId: Int
  accountName: String
  contactId: Int
  contactName: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SyncNetWorthResult {
  entry: NetWorthEntry!
  previousAmount: Float!

  """Mes cuyo saldo de la tarjeta se usó."""
  month: String!
}

"""Punto de la proyección."""
type ProjectionPoint {
  """Número de mes desde el inicio."""
  month: Int!
  balance: Float!
  contributed: Float!
}

"""
Simulación de crecimiento del patrimonio con aportación mensual e interés compuesto.
"""
type Projection {
  id: Int!
  name: String!
  startingAmount: Float!
  monthlyContribution: Float!

  """Tasa anual en porcentaje."""
  annualRate: Float!
  months: Int!
  finalAmount: Float!
  totalContributed: Float!
  interestEarned: Float!

  """Saldo cada `step` meses (12 = un punto por año) más el mes final."""
  schedule(step: Int = 12): [ProjectionPoint!]!
  createdAt: DateTime!
}

"""
Dispositivo de la app móvil registrado para notificaciones push (token de Firebase Cloud Messaging).
"""
type Device {
  id: Int!
  token: String!

  """android, ios o web"""
  platform: String!
  lastSeenAt: DateTime!
  createdAt: DateTime!
}

type DailySummaryResult {
  date: String!

  """Correos enviados."""
  sent: Int!

  """
  Usuarios omitidos: sin correo verificado, sin gastos ese día o ya notificados.
  """
  skipped: Int!
}

type DailySpendingDay {
  """YYYY-MM-DD"""
  date: String!
  total: Float!
  count: Int!

  """Acumulado del mes hasta este día."""
  cumulative: Float!
}

type DailySpending {
  month: String!
  total: Float!
  budget: Float

  """Presupuesto disponible por día (presupuesto / días del mes)."""
  dailyBudget: Float

  """Todos los días del mes, incluidos los que no tienen gastos."""
  days: [DailySpendingDay!]!
}

type CategoryComparisonRow {
  categoryId: Int
  categoryName: String!
  categoryColor: String
  totalA: Float!
  totalB: Float!

  """totalB - totalA"""
  difference: Float!

  """Cambio porcentual de A a B (null si en A no hubo gasto)."""
  percentChange: Float
}

type CategoryComparison {
  monthA: String!
  monthB: String!
  totalA: Float!
  totalB: Float!
  categories: [CategoryComparisonRow!]!
}
